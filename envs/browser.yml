# Optional Linux conversion/validation environment, separate from scientific callers.
# This recipe is version pinned; a tested platform lock is a separate artifact.
name: microc2compare-browser
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy=2.2.6
  - pandas=2.2.3
  - scipy=1.17.1
  - h5py=3.13.0
  - cooler=0.10.4
  - pip
  - pyyaml
  - jsonschema
  - ucsc-bedgraphtobigwig=482
  - pip:
      - clodius==0.22.2
      - pyBigWig==0.3.26
