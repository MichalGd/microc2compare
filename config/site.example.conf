# Maintainer-owned shared software settings. Copy outside the release tree,
# replace every example path, and expose read access to all server users.
# Use a central Conda manager/bootstrap outside personal homes and checked
# microc2compare-owned clone/fallback prefixes. Session caches belong on private
# user home workspaces; never install into or update an existing upstream/home
# software environment. Shared environments remain outside personal homes.
# Bind this to a versioned shared launcher with --site-profile. Routine users
# need no manual source line; project/data paths, resources and sample/design
# tables remain in that user's workspace. Direct unbound helpers may source it.
ENVIRONMENT_MODE="reuse"
CONDA_EXE="/ACTUAL/SHARED/CONDA/bin/conda"
PYTHON_BOOTSTRAP="/ACTUAL/SHARED/PYTHON/bin/python"
CORE_ENV_PREFIX="/ACTUAL/SHARED/CORE/PREFIX"
HICREP_ENV_PREFIX="/ACTUAL/SHARED/HICREP/PREFIX"
# Not needed for descriptive installation; provision only before inference.
DIFF_R_ENV_PREFIX="/ACTUAL/SHARED/DIFFERENTIAL/PREFIX"
